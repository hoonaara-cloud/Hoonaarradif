name: Build Windows VST3

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build-windows-vst3:
    name: Build Windows x64 VST3
    # Visual Studio 17 2022 is installed on the windows-2022 image.
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target HoonaarRadifAtlas_VST3 --parallel 2

      - name: Package VST3 bundle
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE 'build\HoonaarRadifAtlas_artefacts\Release\VST3'
          $plugin = Get-ChildItem -Path $outputRoot -Filter '*.vst3' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $plugin) {
            throw "No .vst3 bundle found under $outputRoot"
          }
          $archive = Join-Path $env:GITHUB_WORKSPACE 'Radif-Atlas-Windows-VST3.zip'
          Compress-Archive -Path $plugin.FullName -DestinationPath $archive -Force
          Write-Host "Packaged $($plugin.Name) to $archive"

      - name: Upload Windows VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radif-Atlas-Windows-VST3
          path: Radif-Atlas-Windows-VST3.zip
          if-no-files-found: error
          retention-days: 30
